name: Tagged release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1
      - name: Package installer and binaries
        shell: powershell
        run: |
          ./scripts/package.ps1 -Version $env:RELEASE_TAG
          ./tests/package_tests.ps1 -Version $env:RELEASE_TAG
      - name: Publish experimental pre-release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "build/release/rp425-bluetooth-native-$env:RELEASE_TAG-windows-x64.zip"
          gh release create $env:RELEASE_TAG $zip ($zip + '.sha256') --verify-tag --title "RP425 Bluetooth Native $env:RELEASE_TAG" --prerelease --notes-file docs/release-notes.md
          if ($LASTEXITCODE) { throw 'GitHub release publication failed.' }
